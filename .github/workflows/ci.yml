name: CI

on:
  pull_request:
  push:
    branches:
      - master

# Cancel superseded runs on the same PR/branch so we don't burn minutes on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Keep in sync with the "packageManager" field in package.json (pnpm@9.15.1).
          version: 9.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Reads the pinned version straight from .nvmrc (currently 22.12.0).
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A real gate. The 13 pre-existing errors this repo shipped with (unused predicates,
      # untyped ChatLlama boundaries, a DevTools-only global in buildDomTree.js) have been
      # fixed or given a justified, narrowly-scoped exemption, so lint is clean and a new
      # error should fail the build rather than scroll past in a log.
      - name: Lint
        run: pnpm lint

      # `pnpm lint` passes --fix, so it can go green by rewriting files rather than by the
      # code being correct. Fail if it changed anything: in CI a fix is a finding, not a fix.
      - name: Fail if lint rewrote files
        run: |
          if ! git diff --quiet; then
            echo "::error::Lint modified files. Run 'pnpm lint' locally and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm -F chrome-extension test

      - name: Build
        run: pnpm build

      # Package + upload only for pushes to master, so a reviewer can grab a loadable build
      # without a local toolchain. `dist/` from the Build step above is already on disk, so this
      # just zips it (equivalent to the root `pnpm zip` script minus the redundant rebuild).
      - name: Package extension zip
        if: github.event_name == 'push'
        run: pnpm -F @extension/zipper zip

      - name: Upload extension build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip-${{ github.sha }}
          path: dist-zip/
          if-no-files-found: error
          retention-days: 14
